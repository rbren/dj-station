[package]
name = "dj-station"
version = "0.1.0"
edition = "2021"
description = "Modular DJ workstation (Tauri shell)"

# Standalone workspace: the Tauri shell is deliberately kept out of the root
# workspace so `cargo test --workspace` stays lean; run.sh / CI build it
# explicitly when a GUI toolchain (webkit2gtk) is present.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# devtools: allow opening the web inspector from release builds too
# (run.sh builds --release; debug builds have it regardless).
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
open = "5"
dj-engine = { path = "../../crates/dj-engine" }
dj-library = { path = "../../crates/dj-library" }

[features]
# custom-protocol embeds frontendDist (app/dist) into the binary and serves
# it over tauri://localhost. Without it the app runs in "dev" mode and tries
# to load devUrl (http://localhost:1420 — the Vite dev server), which shows a
# blank window unless `npm run dev` is running. The `tauri build` CLI enables
# this automatically, but we build with plain cargo, so default it on.
# For live-reload dev against Vite: cargo run --no-default-features (with
# `npm run dev` running in app/).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
