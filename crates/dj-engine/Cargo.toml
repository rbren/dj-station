[package]
name = "dj-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dj-station audio engine: RT-safe patch graph, WASM module host, offline/realtime backends"
# Test targets are declared explicitly below: each one statically links
# wasmtime and costs a full ~18 MB link, so suites are grouped into as few
# binaries as possible (see tests/integration/main.rs). Without this, every
# file under tests/ would also become its own target again.
autotests = false

[features]
default = ["cpal-backend", "midi-hw"]
cpal-backend = ["dep:cpal"]
midi-hw = ["dep:midir"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
# One decode pipeline for the whole app lives in dj-analysis
# (`decode_audio`); `playback::decode_file` re-shapes its output.
dj-analysis = { path = "../dj-analysis" }
anyhow.workspace = true
wasmtime = { version = "37", default-features = false, features = ["cranelift", "runtime", "parallel-compilation"] }
rtrb = "0.3"
libloading = "0.8"
dj-module-sdk = { path = "../dj-module-sdk" }
hound = "3.5"
cpal = { version = "0.16", optional = true }
midir = { version = "0.10", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "integration"
path = "tests/integration/main.rs"

[[test]]
name = "e2e_suite"
path = "tests/e2e_suite/main.rs"

# Standalone by necessity: realtime stress needs a quiet process.
[[test]]
name = "rt_safety"
path = "tests/rt_safety.rs"

[[test]]
name = "perf_m4"
path = "tests/perf_m4.rs"

# Spawns nested `cargo build` runs from a temp dir.
[[test]]
name = "hot_reload"
path = "tests/hot_reload.rs"

[dev-dependencies]
tempfile = "3"
# For the M2 deck <-> library round-trip acceptance test (cues/loops/grids
# persist in the library and reappear in a fresh patch).
dj-library = { path = "../dj-library" }
