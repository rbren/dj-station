[package]
name = "dj-library"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "dj-station sound library: SQLite track DB, watch-folder import, acquisition providers"

[dependencies]
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
roxmltree = "0.20"
sha2 = "0.10"
ureq = { version = "2.12", features = ["json"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "aiff"] }
dirs = "6"

[dev-dependencies]
tempfile = "3"
hound = "3.5"
mockito = "1"
