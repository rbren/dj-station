[workspace]
resolver = "2"
members = [
    "crates/dj-engine",
    "crates/dj-cli",
    "crates/dj-library",
    "crates/dj-module-sdk",
]
# Extension crates build to wasm32 separately; the Tauri app has its own workspace.
exclude = ["extensions", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"

[profile.release]
lto = "thin"

# Fast-but-optimized profile for wasm extensions
[profile.wasm-release]
inherits = "release"
opt-level = 3
