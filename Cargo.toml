[workspace]
resolver = "2"
members = [
    "crates/dj-engine",
    "crates/dj-cli",
    "crates/dj-library",
    "crates/dj-module-sdk",
    "crates/dj-analysis",
    "crates/dj-gesture",
]
# Extension crates build to wasm32 separately; the Tauri app has its own workspace.
exclude = ["extensions", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
thiserror = "2"

[profile.release]
# No LTO here on purpose. This profile covers dj-cli and the test binaries
# only — the shipping Tauri app is a separate workspace with its own profile.
# Every test target statically links wasmtime, so thin LTO cost minutes of
# link time across the suite while buying nothing measurable: the DSP hot path
# is wasmtime-JIT'd code, not cross-crate Rust. Measured on the stress suite,
# thin LTO vs. off is 7.1x / 9.9x vs. 7.1x / 10.2x realtime — noise.
lto = "off"

# Fast-but-optimized profile for wasm extensions
[profile.wasm-release]
inherits = "release"
opt-level = 3
