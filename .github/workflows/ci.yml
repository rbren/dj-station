# CI per PRD §10.1: build, lint, and full tests on every push and PR.
name: CI

on:
  push:
  pull_request:

# A new push to the same ref makes the in-flight run obsolete; don't spend
# runner minutes finishing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing here is reused across runs, and incremental artifacts are large
  # and slow to cache.
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build (Rust workspace + Tauri shell + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # Shared key across build/lint/test: the three jobs compile the same
          # ~370 workspace dependencies, so they share one dependency cache
          # instead of each warming a private copy.
          shared-key: rust-ci
          workspaces: |
            .
            extensions
            app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install system deps (ALSA + webkit2gtk for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Build WASM extensions
        run: ./scripts/build-extensions.sh
      - name: Build Rust workspace
        run: cargo build --workspace --release
      - name: Build frontend
        run: cd app && npm ci && npm run build
      # After frontend: tauri::generate_context! embeds app/dist at compile time.
      - name: Build Tauri shell
        run: cargo build --manifest-path app/src-tauri/Cargo.toml

  lint:
    name: Lint (clippy, rustfmt, ESLint, Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci
          workspaces: |
            .
            extensions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo fmt
        run: cargo fmt --all --check && cd extensions && cargo fmt --all --check
      - name: cargo fmt (native sample extension, own workspace)
        run: cd extensions/gain-native && cargo fmt --all --check
      - name: cargo clippy (engine workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (extensions)
        run: cd extensions && cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: cargo clippy (native sample extension)
        run: cd extensions/gain-native && cargo clippy --all-targets -- -D warnings
      - name: ESLint + Prettier
        run: cd app && npm ci && npm run lint

  test:
    name: Test (cargo test --workspace + frontend tests)
    runs-on: ubuntu-latest
    env:
      # M1 acquisition providers: the authoritative tests run against local
      # mock HTTP servers and need no keys. These optional secrets (empty on
      # forks) additionally enable the real-network Freesound/Jamendo smoke
      # tests in crates/dj-library/tests/real_network.rs, which skip
      # gracefully when the keys are absent.
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci
          workspaces: |
            .
            extensions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Rust tests (release; includes E2E golden audio regression,
          M1 library/watch-folder/provider suites, Playback module tests)
        run: |
          cargo test --workspace --release --exclude dj-engine
          cargo test -p dj-engine --release \
            --test integration --test e2e_suite --test hot_reload
      # M3: keep the optional ONNX stem-separator path compiling. The smoke
      # test skips itself unless DJ_STEMS_ONNX_MODEL points at a model.
      - name: ONNX separator smoke (feature-gated; skips without a model)
        run: cargo test -p dj-analysis --release --features onnx --test onnx_smoke
      - name: Headless smoke via run.sh path
        run: |
          ./scripts/build-extensions.sh
          cargo build --release -p dj-cli
          ./target/release/dj-cli demo /tmp/dj-demo --extensions extensions
          ./target/release/dj-cli render /tmp/dj-demo /tmp/dj-demo.wav --seconds 2 --extensions extensions

  stress:
    name: Realtime stress (rt_safety + perf_m4, 600s equivalent)
    runs-on: ubuntu-latest
    env:
      # Full 10-minute-equivalent offline stress run (PRD M0 acceptance;
      # rendered faster than realtime, see tests/rt_safety.rs). These two
      # suites are deliberately their own job: they want a quiet machine and
      # would otherwise serialize behind the rest of the Rust suite.
      STRESS_SECONDS: "600"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ci
          workspaces: |
            .
            extensions
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Stress tests
        run: cargo test -p dj-engine --release --test rt_safety --test perf_m4

  frontend:
    name: Frontend tests (vitest + jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: cd app && npm ci && npm test
