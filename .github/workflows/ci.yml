# CI per PRD §10.1: build, lint, and full tests on every push and PR.
name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (Rust workspace + Tauri shell + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            extensions
            app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install system deps (ALSA + webkit2gtk for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
      - name: Build WASM extensions
        run: ./scripts/build-extensions.sh
      - name: Build Rust workspace
        run: cargo build --workspace --release
      - name: Build Tauri shell
        run: cargo build --manifest-path app/src-tauri/Cargo.toml
      - name: Build frontend
        run: cd app && npm ci && npm run build

  lint:
    name: Lint (clippy, rustfmt, ESLint, Prettier)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            extensions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: cargo fmt
        run: cargo fmt --all --check && cd extensions && cargo fmt --all --check
      - name: cargo clippy (engine workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo clippy (extensions)
        run: cd extensions && cargo clippy --workspace --target wasm32-unknown-unknown -- -D warnings
      - name: ESLint + Prettier
        run: cd app && npm ci && npm run lint

  test:
    name: Test (cargo test --workspace + frontend tests)
    runs-on: ubuntu-latest
    env:
      # Full 10-minute-equivalent offline stress run (PRD M0 acceptance;
      # rendered faster than realtime, see tests/rt_safety.rs).
      STRESS_SECONDS: "600"
      # M1 acquisition providers: the authoritative tests run against local
      # mock HTTP servers and need no keys. These optional secrets (empty on
      # forks) additionally enable the real-network Freesound/Jamendo smoke
      # tests in crates/dj-library/tests/real_network.rs, which skip
      # gracefully when the keys are absent.
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            extensions
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Rust tests (release; includes E2E golden audio regression,
          M1 library/watch-folder/provider suites, Playback module tests)
        run: cargo test --workspace --release
      - name: Frontend tests (vitest + jsdom)
        run: cd app && npm ci && npm test
      - name: Headless smoke via run.sh path
        run: |
          ./scripts/build-extensions.sh
          cargo build --release -p dj-cli
          ./target/release/dj-cli demo /tmp/dj-demo --extensions extensions
          ./target/release/dj-cli render /tmp/dj-demo /tmp/dj-demo.wav --seconds 2 --extensions extensions
